<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universo para Analy</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
        #ui-layer {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: white;
            font-family: 'Arial', sans-serif;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
        #btn-start {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- Capa de Interfaz Superior (Aquí irá el clima y la fecha después) -->
    <div id="ui-layer">
        <h2 id="fecha-hora"></h2>
        <p>Sincronizando con Atlixco...</p>
    </div>

    <!-- Botón para habilitar giroscopio (Requerido en iOS/Android recientes) -->
    <button id="btn-start">Explorar el Universo</button>

    <!-- Librería Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 1. Configuración Básica de Three.js
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Creación de Estrellas (Partículas)
        const starGeometry = new THREE.BufferGeometry();
        const starCount = 5000;
        const starArray = new Float32Array(starCount * 3);

        for(let i = 0; i < starCount * 3; i++) {
            starArray[i] = (Math.random() - 0.5) * 2000; // Dispersión en el espacio
        }
        
        starGeometry.setAttribute('position', new THREE.BufferAttribute(starArray, 3));
        const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 1.5 });
        const starMesh = new THREE.Points(starGeometry, starMaterial);
        scene.add(starMesh);

        camera.position.z = 5;

        // 3. Variables del Giroscopio
        let targetRotationX = 0;
        let targetRotationY = 0;

        // 4. Iniciar Experiencia y pedir permisos de Giroscopio
        document.getElementById('btn-start').addEventListener('click', function() {
            this.style.display = 'none';
            
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                        }
                    })
                    .catch(console.error);
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
            }
        });

        // 5. Mapear datos del giroscopio a la cámara
        function handleOrientation(event) {
            // beta: inclinación adelante/atrás, gamma: inclinación izquierda/derecha
            const beta = event.beta; 
            const gamma = event.gamma; 
            
            if (beta !== null && gamma !== null) {
                targetRotationX = THREE.MathUtils.degToRad(beta - 90) * 0.5; 
                targetRotationY = THREE.MathUtils.degToRad(gamma) * 0.5;
            }
        }

        // 6. Animación y Renderizado
        function animate() {
            requestAnimationFrame(animate);

            // Rotación suave del universo basada en el giroscopio
            camera.rotation.x += (targetRotationX - camera.rotation.x) * 0.05;
            camera.rotation.y += (targetRotationY - camera.rotation.y) * 0.05;

            // Movimiento constante y lento de las estrellas
            starMesh.rotation.y += 0.0005;

            renderer.render(scene, camera);
        }

        // Reloj en tiempo real
        setInterval(() => {
            document.getElementById('fecha-hora').innerText = new Date().toLocaleString('es-MX');
        }, 1000);

        animate();

        // Ajustar al cambiar tamaño de pantalla
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>

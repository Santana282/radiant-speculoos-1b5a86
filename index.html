<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nuestro Ecosistema</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #0b0c10; overflow: hidden; font-family: 'Georgia', serif; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* Pantalla de Inicio (Estilo Ponanita) */
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #ffd1dc; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 9999; 
            transition: opacity 1s ease; text-align: center; padding: 20px; box-sizing: border-box;
        }
        .card-content { background: #ffffff; padding: 40px 30px; border-radius: 15px; box-shadow: 0 15px 35px rgba(0,0,0,0.15); width: 90%; max-width: 400px; }
        .card-content h1 { color: #d81b60; margin-bottom: 10px; font-size: 1.8em; }
        .emojis { font-size: 3em; margin: 15px 0; }
        #btn-enter {
            background-color: #d81b60; color: white; border: none; padding: 15px 30px;
            border-radius: 30px; font-size: 1.1em; font-weight: bold; cursor: pointer; margin-top: 25px;
        }
        #ui-layer { position: absolute; top: 20px; left: 20px; z-index: 10; color: white; display: none; }
    </style>

    <!-- Importación de Three.js por CDN (Sin Terminal) -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="start-screen">
        <div class="card-content">
            <h1>Para mi Ponanita</h1>
            <div class="emojis">🐼💙🌻</div>
            <p>Un ecosistema vivo diseñado para ti.</p>
            <button id="btn-enter">Activar Ecosistema ✨</button>
        </div>
    </div>

        <!-- Panel del Ecosistema Sobrepuesto al 3D -->
    <div id="ui-layer" style="display: none; width: 100%; padding: 20px; box-sizing: border-box;">
        
        <!-- Tarjeta de Vitalidad -->
        <div style="background: rgba(20, 20, 30, 0.85); border: 1px solid #ff3366; border-radius: 15px; padding: 15px; margin-bottom: 15px; backdrop-filter: blur(10px);">
            <h3 style="margin: 0 0 10px 0; color: #ff3366; font-size: 1rem;">🌱 Vitalidad y Comprobación</h3>
            <div style="width: 100%; background: #333; border-radius: 10px; height: 10px; margin-bottom: 5px;">
                <div id="barra-vitalidad" style="width: 10%; height: 100%; background: linear-gradient(90deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%); border-radius: 10px; transition: width 0.5s ease;"></div>
            </div>
            <p style="margin: 0; font-size: 0.85rem; color: #ddd;" id="ui-vitalidad">10% (0/14 hojas • 0/6 acuerdos)</p>
        </div>

        <!-- Tarjeta de Tierra y Agua -->
        <div style="background: rgba(20, 20, 30, 0.85); border: 1px solid #4caf50; border-radius: 15px; padding: 15px; margin-bottom: 15px; backdrop-filter: blur(10px);">
            <h3 style="margin: 0 0 10px 0; color: #4caf50; font-size: 1rem;">💧 La Tierra (Raíz y Hogar)</h3>
            <p style="margin: 0 0 10px 0; font-size: 0.85rem; color: #ddd;">Nivel de Humedad: <strong id="ui-humedad">25% - Calculando...</strong></p>
            <button id="btn-regar" style="width: 100%; background: linear-gradient(90deg, #00c6ff 0%, #0072ff 100%); border: none; padding: 12px; border-radius: 10px; color: white; font-weight: bold; font-size: 1rem; cursor: pointer;">
                🌧️ Regar Girasol (Tu Amor 24/7)
            </button>
        </div>

        <!-- Tarjeta de Conflicto (Hoja Seca) -->
        <div style="background: rgba(20, 20, 30, 0.85); border: 1px solid #ff9800; border-radius: 15px; padding: 15px; backdrop-filter: blur(10px);">
            <h3 style="margin: 0 0 5px 0; color: #ff9800; font-size: 1rem;">🌻 Etapa 1: Girasol del Alba</h3>
            <p style="margin: 0 0 10px 0; font-size: 0.75rem; color: #aaa;">Hoja 1: Madrugada en Discord (Castigo de Silencio)</p>
            <button id="btn-sanar" style="width: 100%; background: linear-gradient(90deg, #ff9800 0%, #ff5722 100%); border: none; padding: 12px; border-radius: 10px; color: white; font-weight: bold; font-size: 1rem; cursor: pointer;">
                ✨ Sanar esta Hoja
            </button>
        </div>
    </div>
        <h2 style="margin: 0; font-size: 1.2rem; color: #ff3366;">Conexión Cuántica Estable</h2>
    </div>
    
    <div id="canvas-container"></div>
    <!-- Archivo lógico que crearemos en la carpeta js -->
    <script type="module" src="./js/app.js"></script>
</body>
</html>

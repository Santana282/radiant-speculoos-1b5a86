<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Analy's Server</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        :root {
            --mc-blue-light: #55FFFF;
            --mc-blue-dark: #0000AA;
            --mc-bg: #111111;
            --mc-border: #333333;
            --mc-text: #FFFFFF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #0c141f;
            color: var(--mc-text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 400px;
        }

        .mc-window {
            background: rgba(0, 0, 0, 0.85);
            border: 4px solid var(--mc-border);
            border-top-color: #555555;
            border-left-color: #555555;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        h1 {
            font-family: 'Press Start 2P', monospace;
            font-size: 1.2rem;
            color: #fff;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 3px 3px 0 #000;
            line-height: 1.5;
        }

        .mc-btn {
            background-color: #727272;
            border: 3px solid;
            border-top-color: #9E9E9E; border-left-color: #9E9E9E;
            border-bottom-color: #303030; border-right-color: #303030;
            color: white;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.7rem;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            text-transform: uppercase;
            text-decoration: none;
            display: block;
        }

        .mc-btn.blue {
            background-color: #0078D7;
            border-top-color: #3399FF; border-left-color: #3399FF;
            border-bottom-color: #004C99; border-right-color: #004C99;
        }

        .mc-btn:active {
            transform: scale(0.98);
        }

        #particles {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1;
        }

        .pixel-particle {
            position: absolute;
            font-size: 1.2rem;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-50px); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(100vh); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="particles"></div>

    <div class="container">
        <div class="mc-window">
            <h1>ANALYS<br><span style="color: var(--mc-blue-light);">SERVER</span></h1>
            
            <!-- Estos botones dirigirán a los otros archivos HTML que crearemos en los siguientes pasos -->
            <a href="invernadero.html" class="mc-btn blue">1. El Invernadero</a>
            <a href="carta.html" class="mc-btn">2. Primer Mes</a>
            <a href="diarios.html" class="mc-btn" style="color: #ff9999;">3. Zona Segura (Diarios)</a>
        </div>
    </div>

    <script>
        function createParticles() {
            const container = document.getElementById('particles');
            const items = ['💎', '</>', '💙', '👩‍🍳', '🎯', '🧊']; 
            
            setInterval(() => {
                const particle = document.createElement('div');
                particle.classList.add('pixel-particle');
                particle.innerText = items[Math.floor(Math.random() * items.length)];
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.animationDuration = (Math.random() * 4 + 4) + 's';
                container.appendChild(particle);
                
                setTimeout(() => { particle.remove(); }, 8000);
            }, 600);
        }
        window.onload = createParticles;
    </script>
</body>
</html>

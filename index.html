<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nuestro Ecosistema Cuántico</title>
    <!-- Vinculación de la PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nuestro Jardín">
    
    <style>
        /* Estilos base para eliminar márgenes y preparar el entorno 3D */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0c10;
            overflow: hidden; /* Evita que Analy mueva la pantalla por accidente */
            font-family: 'Georgia', serif;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            color: rgba(255, 255, 255, 0.8);
            pointer-events: none;
        }
    </style>

    <!-- Mapa de importación para evitar usar terminales o dependencias locales -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ui-layer">
        <h2 style="margin: 0; font-size: 1.2rem; color: #ff3366;">Conexión Cuántica Estable</h2>
        <p style="margin: 5px 0; font-size: 0.9rem;">Sincronización Orizaba - Atlixco</p>
    </div>
    
    <!-- Aquí se renderizará todo el universo -->
    <div id="canvas-container"></div>

    <!-- Llamada al archivo lógico principal -->
    <script type="module" src="js/app.js"></script>
</body>
</html>

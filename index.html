<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nuestro Ecosistema</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #0b0c10; overflow: hidden; font-family: 'Georgia', serif; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        #start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #ffd1dc; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.8s ease; text-align: center; padding: 20px; box-sizing: border-box; }
        .card-content { background: #ffffff; padding: 40px 30px; border-radius: 15px; box-shadow: 0 15px 35px rgba(0,0,0,0.15); width: 90%; max-width: 400px; }
        .card-content h1 { color: #d81b60; margin-bottom: 10px; font-size: 1.8em; }
        .emojis { font-size: 3em; margin: 15px 0; filter: drop-shadow(0px 4px 4px rgba(0,0,0,0.2)); }
        
        #btn-enter { background-color: #d81b60; color: white; border: none; padding: 15px 30px; border-radius: 30px; font-size: 1.1em; font-weight: bold; cursor: pointer; margin-top: 25px; box-shadow: 0 5px 15px rgba(216, 27, 96, 0.4); -webkit-tap-highlight-color: transparent; }
        #btn-enter:active { transform: scale(0.95); }
        
        #ui-layer { position: absolute; top: 20px; left: 20px; z-index: 10; width: 90%; max-width: 380px; display: none; }
    </style>
</head>
<body>
    <div id="start-screen">
        <div class="card-content">
            <h1>Para mi Ponanita</h1>
            <div class="emojis">🐼💙🌻</div>
            <p style="color: #444; font-style: italic;">Un ecosistema vivo diseñado para ti.</p>
            <button id="btn-enter">Activar Ecosistema ✨</button>
        </div>
    </div>

    <div id="ui-layer">
        <div style="background: rgba(20, 20, 30, 0.85); border: 1px solid #ff3366; border-radius: 15px; padding: 15px; backdrop-filter: blur(10px);">
            <h3 style="margin: 0 0 5px 0; color: #ff3366; font-size: 1rem;">🌱 Vitalidad: <span id="ui-vitalidad">10%</span></h3>
            <p style="margin: 0; font-size: 0.8rem; color: #ddd;">Calculando conexión Orizaba - Atlixco...</p>
        </div>
    </div>
    
    <div id="canvas-container"></div>

    <!-- Carga segura y directa del motor gráfico -->
    <script type="module" src="./js/app.js"></script>
</body>
</html>

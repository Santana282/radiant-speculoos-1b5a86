<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIARIOS & BITÁCORA | Kevin & Analy</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <canvas id="spaceCanvas"></canvas>

    <header class="header-banner">
        <h1 class="main-title">Diarios de Nuestra Vida</h1>
        <p class="subtitle">Historias, reflexiones en primera persona y nuestra bitácora bilateral.</p>
    </header>

    <main class="content-container">
        <!-- Pestañas para conmutar -->
        <div class="tabs-header">
            <button id="btnDiarioKevin" class="tab-btn active" onclick="mostrarDiario('kevin')">👨🏻‍💻 Diario de Kevin</button>
            <button id="btnDiarioAnaly" class="tab-btn" onclick="mostrarDiario('analy')">👩🏻‍🍳 Bitácora de Analy</button>
        </div>

        <!-- Sección Diario de Kevin -->
        <section id="diarioKevinSection" class="diario-section">
            <div id="diariosContainer"></div>
        </section>

        <!-- Sección Bitácora Interactiva de Analy -->
        <section id="diarioAnalySection" class="diario-section hidden">
            <div class="card bitacora-box">
                <h3>✍️ Tu Espacio de Notas y Sentimientos (Analy)</h3>
                <p>Escribe lo que sientes, notas o reflexiones del día. Se guardará automáticamente en tu dispositivo.</p>
                <textarea id="notaAnalyInput" placeholder="Escribe aquí tu pensamiento de hoy..."></textarea>
                <button class="action-btn" onclick="guardarNotaAnaly()">Guardar Nota</button>
            </div>
            <div id="notasAnalyGuardadas" class="notas-list"></div>
        </section>
    </main>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">🌌 Universo</a>
        <a href="invernadero.html" class="nav-item">🌻 Girasoles</a>
        <a href="diarios.html" class="nav-item active">📖 Diarios</a>
    </nav>

    <script src="js/space.js"></script>
    <script>
        const diariosKevinData = [
            {
                id: "d1",
                fecha: "22 de Julio de 2026",
                titulo: "El inicio formal de nuestra historia compartida",
                categoria: "Compromiso",
                contenido: "Hoy marcamos el inicio oficial de nuestro noviazgo. Aunque la distancia física entre Orizaba y Atlixco plantea desafíos, sé con absoluta firmeza que Analy es la mujer con la que quiero construir mi futuro. Mi enfoque como desarrollador a veces me hace buscar soluciones racionales inmediatas, pero ella me enseña cada día que la presencia afectiva y la escucha atenta valen más que cualquier código."
            },
            {
                id: "d2",
                fecha: "28 de Julio de 2026",
                titulo: "Madrugadas de Call of Duty y el aprendizaje de la empatía",
                categoria: "Aprendizaje",
                contenido: "Eran las 4:00 AM tras una larga sesión de juego. Al desconectarme o bajar la interacción por cansancio, no preví cómo ese silencio repentino detonaría en Analy incertidumbre sobre su lugar en mi vida. Me dolió profundamente verla sobrepensar. Prometí firmeza en comunicar mi estado antes de aislarme y asegurarle siempre que ella es y será mi máxima prioridad."
            },
            {
                id: "d3",
                fecha: "Jornada de Panadería y Cuidados a la Distancia",
                categoria: "Cuidado Afectivo",
                contenido: "Tras una jornada extenuante horneando 26 charolas de pan y preparando pechugas al horno, el cansancio físico era pesado. Sin embargo, mi mente estaba enfocada en el malestar de Analy y en verificar sus tomas de medicina cada 8 horas. Enviarle sus comidas favoritas y estar al pendiente es mi manera de acortar los kilómetros entre nosotros."
            },
            {
                id: "d4",
                fecha: "Proyección y Metas: El Sueño de Disney",
                categoria: "Futuro",
                contenido: "Afrontar las dudas sobre la futura mudanza juntos me exige disciplina financiera y profesional. Ver la pasión de Analy en su carrera de Gastronomía me inspira a dar mi 100%. Mi gran meta es brindarle estabilidad total y cumplir nuestro sueño de viajar juntos a Disney."
            }
        ];

        function renderizarDiarioKevin() {
            const container = document.getElementById('diariosContainer');
            container.innerHTML = diariosKevinData.map(entry => `
                <article class="card diario-entry">
                    <div class="entry-header">
                        <span class="badge category">${entry.categoria}</span>
                        <span class="entry-date">${entry.fecha}</span>
                    </div>
                    <h3>${entry.titulo}</h3>
                    <p class="entry-text">${entry.contenido}</p>
                </article>
            `).join('');
        }

        function mostrarDiario(tipo) {
            const secK = document.getElementById('diarioKevinSection');
            const secA = document.getElementById('diarioAnalySection');
            const btnK = document.getElementById('btnDiarioKevin');
            const btnA = document.getElementById('btnDiarioAnaly');

            if (tipo === 'kevin') {
                secK.classList.remove('hidden');
                secA.classList.add('hidden');
                btnK.classList.add('active');
                btnA.classList.remove('active');
            } else {
                secA.classList.remove('hidden');
                secK.classList.add('hidden');
                btnA.classList.add('active');
                btnK.classList.remove('active');
                cargarNotasAnalyUI();
            }
        }

        function guardarNotaAnaly() {
            const txt = document.getElementById('notaAnalyInput').value.trim();
            if (!txt) return;
            const notas = JSON.parse(localStorage.getItem('bitacora_analy_entries') || '[]');
            notas.unshift({ fecha: new Date().toLocaleString('es-MX'), texto: txt });
            localStorage.setItem('bitacora_analy_entries', JSON.stringify(notas));
            document.getElementById('notaAnalyInput').value = '';
            cargarNotasAnalyUI();
        }

        function cargarNotasAnalyUI() {
            const container = document.getElementById('notasAnalyGuardadas');
            const notas = JSON.parse(localStorage.getItem('bitacora_analy_entries') || '[]');
            if (notas.length === 0) {
                container.innerHTML = '<p class="empty-msg">No hay notas guardadas aún.</p>';
                return;
            }
            container.innerHTML = notas.map(n => `
                <div class="card nota-item">
                    <small>${n.fecha}</small>
                    <p>${n.texto}</p>
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', renderizarDiarioKevin);
    </script>
</body>
</html>
